name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      # Use the committed wrapper when present, otherwise the Gradle installed above.
      - name: Build, test and lint
        run: |
          if [ -x ./gradlew ]; then G=./gradlew; else G=gradle; fi
          set -o pipefail
          $G assembleDebug testDebugUnitTest lintDebug --continue 2>&1 | tee build.log
      # Surface compile errors and failing tests as annotations (readable without downloading logs).
      - name: Annotate failures
        if: failure()
        run: |
          grep -E '^e: ' build.log | head -20 | sed 's/^e: /::error::/' || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  for fail in list(tc.iter("failure")) + list(tc.iter("error")):
                      msg = (fail.get("message") or fail.text or "").strip().splitlines()
                      first = msg[0][:300] if msg else ""
                      print(f"::error title={tc.get('classname')}::{tc.get('name')}: {first}")
                      n += 1
          print(f"{n} failing test cases")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
